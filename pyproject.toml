[project]
name = "pdf-embedding"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pankaj Dhurandher", email = "138053281+pankajdhurandher@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "docx2txt>=0.9",
    "ipykernel>=7.3.0",
    "langchain>=1.3.17",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.0",
    "langchain-groq>=1.1.3",
    "langchain-text-splitters>=1.1.2",
    "pymupdf>=1.28.2",
    "pypdf>=6.16.2",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=6.0.0",
]

[project.scripts]
pdf-embedding = "pdf_embedding:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
